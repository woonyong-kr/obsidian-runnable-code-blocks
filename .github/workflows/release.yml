name: Prepare Obsidian release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact manifest version
        required: true

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=1" --jq ' .workflow_runs[0].conclusion')"
          test "$conclusion" = success
      - run: npm ci
      - run: npm run build
      - run: npm run verify:release
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: exit 1
      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: test "$(node -p 'require("./manifest.json").version')" = "$REQUESTED_VERSION"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            local-runner/dist/runnable-code-blocks-local-runner.mjs
      - name: Create plugin draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "$REQUESTED_VERSION"
          --draft
          --generate-notes
          --target "$GITHUB_SHA"
          main.js manifest.json styles.css
      - name: Create separate companion draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "companion-$REQUESTED_VERSION"
          --draft
          --latest=false
          --title "Optional local companion for $REQUESTED_VERSION"
          --notes "Standalone Node.js 22 program. This is not an Obsidian plugin installation. Existing compatible companions and pairing tokens do not need to be replaced. See local-runner/README.md in the tagged source for setup."
          --target "$GITHUB_SHA"
          local-runner/dist/runnable-code-blocks-local-runner.mjs LICENSE
