name: Prepare Obsidian release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact manifest version
        required: true

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: exit 1
      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: test "$(node -p 'require("./manifest.json").version')" = "$REQUESTED_VERSION"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            local-runner/dist/runnable-code-blocks-local-runner.mjs
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "$REQUESTED_VERSION"
          --draft
          --generate-notes
          --target "$GITHUB_SHA"
          main.js manifest.json styles.css local-runner/dist/runnable-code-blocks-local-runner.mjs
